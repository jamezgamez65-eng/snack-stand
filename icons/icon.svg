<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#148C84"/>
    </linearGradient>
    <clipPath id="bucket">
      <path d="M150 258 L362 258 L340 432 L334 442 L322 446 L190 446 L178 442 L172 432 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- flying kernels -->
  <g fill="#FFF6DC" stroke="#F2C14E" stroke-width="4">
    <circle cx="112" cy="150" r="14"/>
    <circle cx="402" cy="122" r="11"/>
    <circle cx="150" cy="96" r="9"/>
  </g>

  <!-- popcorn mound -->
  <g fill="#FFF6DC" stroke="#F2C14E" stroke-width="5">
    <circle cx="170" cy="222" r="36"/>
    <circle cx="358" cy="224" r="34"/>
    <circle cx="216" cy="196" r="42"/>
    <circle cx="316" cy="198" r="42"/>
    <circle cx="266" cy="186" r="46"/>
    <circle cx="236" cy="230" r="34"/>
    <circle cx="296" cy="232" r="34"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="203" cy="180" r="10"/>
    <circle cx="250" cy="168" r="11"/>
    <circle cx="302" cy="182" r="10"/>
    <circle cx="158" cy="208" r="8"/>
    <circle cx="346" cy="210" r="8"/>
  </g>

  <!-- bucket -->
  <g clip-path="url(#bucket)">
    <rect x="130" y="250" width="260" height="210" fill="#ffffff"/>
    <polygon points="150,258 192.4,258 208,446 176,446" fill="#E63946"/>
    <polygon points="234.8,258 277.2,258 272,446 240,446" fill="#E63946"/>
    <polygon points="319.6,258 362,258 336,446 304,446" fill="#E63946"/>
  </g>
  <path d="M150 258 L362 258 L340 432 L334 442 L322 446 L190 446 L178 442 L172 432 Z" fill="none" stroke="#C1121F" stroke-width="4" stroke-linejoin="round"/>

  <!-- rim -->
  <rect x="138" y="230" width="236" height="36" rx="18" fill="#E63946"/>
  <rect x="138" y="252" width="236" height="14" rx="7" fill="#C1121F" opacity="0.55"/>
</svg>
